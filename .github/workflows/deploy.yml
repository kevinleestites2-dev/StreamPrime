name: Build & Deploy StreamPrime

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_OMDB_API_KEY: ${{ secrets.VITE_OMDB_API_KEY }}

      - name: List dist contents
        run: ls -la dist/

      - name: Zip dist
        run: cd dist && zip -r ../dist.zip . && echo "Zip size:" && du -sh ../dist.zip

      - name: Deploy to Netlify via API
        run: |
          echo "Deploying to site fb850a8c-22fb-4964-84a4-e43186fa9736"
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @dist.zip \
            "https://api.netlify.com/api/v1/sites/fb850a8c-22fb-4964-84a4-e43186fa9736/deploys")
          echo "Full API response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Deploy ID:', d.get('id')); print('State:', d.get('state')); print('URL:', d.get('ssl_url') or d.get('url'))" || echo "Could not parse JSON response"
